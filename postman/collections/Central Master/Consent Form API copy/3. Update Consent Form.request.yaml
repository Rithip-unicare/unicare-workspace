      "isEnabled": true,
      "isMobileEnabled": false,
      "isTabletEnabled": true,
      "isDesktopEnabled": true,
      "isDentalEnabled": false,
      "isPreviewEnabled": true
    }
auth:
  type: noauth
order: 3000
