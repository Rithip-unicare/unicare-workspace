$kind: http-request
url: "{{baseUrl}}/api/organization/email-config"
method: POST
body:
  type: json
  content: |-
    {
      "organizationId": 1,
      "host": "localhost",
      "port": 587,
      "userName": "string",
      "password": "string",
      "useAuth": true,
      "protocol": "string"
    }
auth:
  type: bearer
order: 1000
