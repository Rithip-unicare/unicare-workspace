$kind: http-request
url: "{{baseUrl}}/api/organization/user-theme-settings"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
      "userId": 1,
      "organizationId": 1,
      "theme": "dark",
      "languagePreference": "en",
      "isActive": true
    }
auth:
  type: noauth
order: 3000
