$kind: http-request
url: "{{baseUrl}}/api/auth/change-password"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": 1,
      "oldPassword": "123456",
      "newPassword": "12345678"
    }
auth:
  type: noauth
order: 4000
