$kind: http-request
url: "{{baseUrl}}/api/auth/logout-sessions"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": 1,
      "sessionIds": [
        "uuid-1"
      ]
    }
auth:
  type: noauth
order: 8000
