$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Authorization: Bearer {{accessToken}}
body:
  type: json
  content: |-
    {
      "username": "partm",
      "password": "parthi"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      const body = pm.response.json();

      pm.environment.set("accessToken", body.data.token);
    language: text/javascript
order: 1000
