  id: "1"
body:
  type: json
  content: |-
    {
      "userId": 1,
      "moduleId": "module_uuid_here",
      "subModuleId": "sub_module_uuid_here",
      "isPermission": true,
      "isAdd": true,
      "isEdit": true,
      "isDelete": true,
      "isView": true,
      "isActive": true,
      "createdBy": 1,
      "updatedBy": 1
    }
auth:
  type: noauth
order: 4000
