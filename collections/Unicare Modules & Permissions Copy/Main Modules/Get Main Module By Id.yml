info:
  name: Get Main Module By Id
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/organization/main-modules/:id"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: id
      value: uuid_here
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
