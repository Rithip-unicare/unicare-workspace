info:
  name: Get All Sub Modules
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/organization/sub-modules?page=0&size=500"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "500"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
