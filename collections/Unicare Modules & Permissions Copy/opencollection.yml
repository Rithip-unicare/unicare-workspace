opencollection: 1.0.0

info:
  name: Unicare Modules & Permissions Copy

request:
  variables:
    - name: baseUrl
      value: http://localhost:8080
    - name: accessToken
      value: your_access_token_here

docs:
  content: Postman collection for MainModule, SubModule, RoleModulePermission, and UserModulePermission via API Gateway.
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
