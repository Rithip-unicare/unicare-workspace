info:
  name: Patient View Appointments
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/core/appointments/patient-view"
  headers:
    - name: X-User-Id
      value: "{{userId}}"
  body:
    type: json
    data: |-
      {
          "patientDetailId": 1,
          "hospitalDetailId": 1
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
