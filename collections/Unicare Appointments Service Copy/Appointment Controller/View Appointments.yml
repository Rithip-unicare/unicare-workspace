info:
  name: View Appointments
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/core/appointments/view"
  headers:
    - name: X-User-Id
      value: "{{userId}}"
      disabled: true
    - name: Authorization
      value: "Bearer {{accessToken}} "
  body:
    type: json
    data: |-
      {
          "doctorIds": [
              1,
              3
          ],
          "hospitalDetailId": 1,
          "startDate": "2026-04-01",
          "endDate": "2026-06-30"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
