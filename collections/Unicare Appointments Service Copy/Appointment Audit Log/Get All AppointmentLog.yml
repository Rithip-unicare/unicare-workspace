info:
  name: Get All AppointmentLog
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/core/audit-logs/appointment/1/all?page=0&size=500"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "500"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
