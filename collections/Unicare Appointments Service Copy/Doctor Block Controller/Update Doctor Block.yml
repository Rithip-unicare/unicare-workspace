info:
  name: Update Doctor Block
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/api/core/doctor-blocks"
  headers:
    - name: X-User-Id
      value: "{{userId}}"
  body:
    type: json
    data: |-
      {
          "blockId": 2,
           "hospitalDetailId": 1,
           "doctorId": 3,
           "startDate": "2026-05-15",
           "endDate": "2026-05-30",
           "startTime": "10:00:00",
           "endTime": "11:00:00",
            "isRecursive": false,
            "remarks": "string"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
