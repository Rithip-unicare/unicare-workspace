info:
  name: Get Doctor block
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/core/doctor-blocks"
  headers:
    - name: X-User-Id
      value: "{{userId}}"
  body:
    type: json
    data: |-
      {
          "doctorId": 3,
          "hospitalId": 1,
          "startDate": "2026-05-15",
          "endDate": "2026-05-30"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
