info:
  name: Get Phone Enquiry Logs
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/core/audit-logs/phone-enquiry/1/all?page=0&size=10"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
