http:
  method: POST
  url: "{{baseUrl}}/api/Messages/sendmedia"
  headers:
    - name: accept
      value: "*/*"
    - name: X-Api-Key
      value: "{{apikey}}"
  body:
    type: multipart-form
    data:
      - name: MsgText
