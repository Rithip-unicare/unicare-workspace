info:
  name: Send text with button
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/Messages/sendtext"
  headers:
    - name: accept
      value: "*/*"
    - name: X-Api-Key
      value: "{{apikey}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "msgText": "Hello test message",
        "contactNo": "{{mobileNo}}",
        "buttons": [
          {
            "buttonTitle": "Book now"
          }
        ]

      }

runtime:
  variables:
    - name: apikey
      value: D7ABBC42-8A61-47B0-9CF2-F7C4C8927536
    - name: mobileNo
      value:
        type: number
        data: "919113098166"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: Send text with button
    request:
      url: https://apiv1.anantya.ai/api/Messages/sendtext
      method: POST
      headers:
        - name: accept
          value: "*/*"
        - name: X-Api-Key
          value: "{{apikey}}"
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "msgText": "Hello test message",
            "contactNo": "•••••••",
            "buttons": [
              {
                "buttonTitle": "Book now"
              }
            ]

          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Transfer-Encoding
          value: chunked
        - name: Content-Type
          value: application/json; charset=utf-8
        - name: Server
          value: Microsoft-IIS/10.0
        - name: X-Rate-Limit-Limit
          value: 10s
        - name: X-Rate-Limit-Remaining
          value: "999"
        - name: X-Rate-Limit-Reset
          value: 2024-03-12T11:07:16.6377038Z
        - name: X-Powered-By
          value: ASP.NET
        - name: Date
          value: Tue, 12 Mar 2024 11:07:10 GMT
      body:
        type: json
        data: |-
          {
              "dataObj": {
                  "msgId": 7407,
                  "keyFromMe": 1,
                  "mediaType": "BUTTON",
                  "msgText": "{\"buttons\":[{\"type\":\"reply\",\"id\":\"0\",\"text\":\"Book now\"}],\"List\":null,\"Body\":{\"text\":\"Hello test message\"},\"header\":null}",
                  "msgTime": "12/03/2024 16:37:00",
                  "msgStatus": 0,
                  "contactNo": "••••••••••••",
                  "mediaFileName": null,
                  "fileExt": null,
                  "channelName": "WHATSAPP"
              },
              "isSuccess": true,
              "message": null
          }

