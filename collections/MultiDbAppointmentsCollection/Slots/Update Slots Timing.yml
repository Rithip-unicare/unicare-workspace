info:
  name: Update Slots Timing
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/doctors/slots/update-timing"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
          "doctorId": 1,
          "centerId": 1,
          "fromLocation": "ALB1",
          "fromdate": "2026-08-01",
          "todate": "2026-08-31",
          "oldFromTime": "12:00:00",
          "oldToTime": "17:00:00",
          "newfromTime": "12:00:00",
          "newtoTime": "14:30:00",
          "toLocation": "ALB7"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
