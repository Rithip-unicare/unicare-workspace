info:
  name: Message logs
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/message-logs"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "patientId": 40160,
        "location": "ALB1",
        "page": 0,
        "size": 10
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
