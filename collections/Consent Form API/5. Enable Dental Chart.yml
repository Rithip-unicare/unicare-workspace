info:
  name: 5. Enable Dental Chart
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/admin/consentform/dental-chart-enable?{{formId}}"
  headers:
    - name: Authorization
      value: Bearer {{accesstoken}}
  params:
    - name: id
      value: "{{formId}}"
      type: query
      description: Sent as query param
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
