http:
  method: POST
  url: "{{baseUrl}}/admin/consentform/createPermissions"
  headers:
    - name: Authorization
      value: Bearer {{accesstoken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "orgId": 1,
        "faciltyId": "facility_001",
        "formIds": ["form_001", "form_002"]
      }
