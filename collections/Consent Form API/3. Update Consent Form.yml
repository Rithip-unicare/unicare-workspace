info:
  name: 3. Update Consent Form
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/admin/consentform/update"
  headers:
    - name: Authorization
      value: Bearer {{accesstoken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "formId": "form_001",
        "formName": "General Consent Form (Updated)",
        "department": "OPD",
        "isEnabled": true,
        "isMobileEnabled": false,
        "isTabletEnabled": true,
        "isDesktopEnabled": true,
        "isDentalEnabled": false,
        "isPreviewEnabled": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
