info:
  name: Get All Follow-ups (All Branches)
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/followup/all-branches?page =10&size=100"
  params:
    - name: "page "
      value: "10"
      type: query
    - name: size
      value: "100"
      type: query
  body:
    type: json
    data: "{\r

      \  \"emiratesId\": \"\",\r

      \  \"patientName\": \"\",\r

      \  \"doctorName\": \"\",\r

      \  \"fromDate\": \"\",\r

      \  \"toDate\": \"\",\r

      \  \"flupRqstDone\": \"\",\r

      \  \"location\": \"\"\r

      }"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get all follow-up records across all branches with optional filters.
