info:
  name: Get Follow-up Peak Months Comparison
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/followup/stats/peak-months-comparison?fromYear=2025&toYear=2026&location=ALB4"
  params:
    - name: fromYear
      value: "2025"
      type: query
    - name: toYear
      value: "2026"
      type: query
    - name: location
      value: ALB4
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Get peak months comparison across years.
