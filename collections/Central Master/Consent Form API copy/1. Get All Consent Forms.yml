info:
  name: 1. Get All Consent Forms
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/admin/consentform/all"
  headers:
    - name: Authorization
      value: Bearer {{accesstoken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: Returns all consent forms as a list.
