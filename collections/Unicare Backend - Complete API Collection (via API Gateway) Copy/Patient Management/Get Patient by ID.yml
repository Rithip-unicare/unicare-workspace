info:
  name: Get Patient by ID
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/core/patients/:patientId?hospitalId=1"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: hospitalId
      value: "1"
      type: query
    - name: patientId
      value: "35"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
