info:
  name: Get Patient by MR Number
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/core/patients/mr/:mrNumber?hospitalId=1"
  params:
    - name: hospitalId
      value: "1"
      type: query
    - name: mrNumber
      value: MAXA0000004
      type: path
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
