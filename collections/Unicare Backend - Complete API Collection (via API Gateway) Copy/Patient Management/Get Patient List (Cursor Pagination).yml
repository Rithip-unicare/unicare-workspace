info:
  name: Get Patient List (Cursor Pagination)
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/core/patients?hospitalId=1&page=0&Size=100"
  params:
    - name: hospitalId
      value: "1"
      type: query
    - name: page
      value: "0"
      type: query
    - name: lastId
      value: ""
      type: query
      disabled: true
    - name: Size
      value: "100"
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
