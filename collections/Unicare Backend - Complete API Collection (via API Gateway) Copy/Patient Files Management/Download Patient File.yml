info:
  name: Download Patient File
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/core/patients/:patientId/files/:category"
  params:
    - name: patientId
      value: "1"
      type: path
    - name: category
      value: profile
      type: path
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
