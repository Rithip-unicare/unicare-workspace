info:
  name: Logout All
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/auth/logout-all?userId=1"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: userId
      value: "1"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
