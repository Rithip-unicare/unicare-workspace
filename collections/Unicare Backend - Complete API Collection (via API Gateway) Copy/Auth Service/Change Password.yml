info:
  name: Change Password
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/auth/change-password"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "userId": 1,
        "oldPassword": "123456",
        "newPassword": "12345678"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
