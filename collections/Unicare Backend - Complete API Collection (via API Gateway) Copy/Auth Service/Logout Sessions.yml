info:
  name: Logout Sessions
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/auth/logout-sessions"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "userId": 1,
        "sessionIds": [
          "uuid-1"
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
