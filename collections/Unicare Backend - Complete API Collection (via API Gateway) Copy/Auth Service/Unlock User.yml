info:
  name: Unlock User
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/api/auth/unlock-user?userId=2"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: userId
      value: "2"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
