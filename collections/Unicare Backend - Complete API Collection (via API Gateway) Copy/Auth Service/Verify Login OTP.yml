info:
  name: Verify Login OTP
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}/api/auth/verify-login-otp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "userId": 14,
        "otp": "688740"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var jsonData = res.getBody();
        if(jsonData.data && jsonData.data.accessToken) { bru.setVar('accessToken', jsonData.data.accessToken); }
        if(jsonData.data && jsonData.data.sessionId) { bru.setVar('sessionId', jsonData.data.sessionId); }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
