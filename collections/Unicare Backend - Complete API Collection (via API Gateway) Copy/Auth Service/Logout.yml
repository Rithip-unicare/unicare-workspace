info:
  name: Logout
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/logout?sessionId={{sessionId}}"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  params:
    - name: sessionId
      value: "{{sessionId}}"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
