info:
  name: Verify Reset OTP
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/auth/verify-reset-otp"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "userId": 1,
        "otp": "123456",
        "newPassword": "newPwd"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
