info:
  name: Create Doctor Fee
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/organization/doctors/fee"
  body:
    type: json
    data: |
      {
        "doctorId": 28,
        "consultation": "General Consultation",
        "charges": 150.00,
        "isActive": true
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
