info:
  name: Create Doctor Fee
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/organization/doctors/fee"
  body:
    type: json
    data: |-
      {
        "doctorId": 5,
        "consultation": "Audit Test 2",
        "charges": 200.00,
        "isActive": true
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
