info:
  name: "Roles: Assign Role to User"
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/api/organization/roles/assign"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "userId": 1,
        "roleId": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
