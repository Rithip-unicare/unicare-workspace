info:
  name: Update User Theme Settings
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/organization/user-theme-settings"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "userId": 1,
        "organizationId": 1,
        "theme": "light",
        "languagePreference": "ar",
        "isActive": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
