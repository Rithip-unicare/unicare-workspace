info:
  name: "Roles: Assign Permission to Role"
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/api/organization/role-permission"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "roleId": 1,
        "permissionIds": [9]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
