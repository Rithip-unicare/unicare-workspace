info:
  name: "Organization Settings: Create"
  type: http
  seq: 36

http:
  method: POST
  url: "{{baseUrl}}/api/organization/organization-settings"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "organizationId": 1,
        "locationShortName": "HQ",
        "centerName": "Main Center",
        "hospitalType": "General",
        "facilityId": "FAC123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
