info:
  name: "Permissions: Create"
  type: http
  seq: 23

http:
  method: POST
  url: "{{baseUrl}}/api/organization/permissions"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "module": "PATIENT",
        "action": "CREATE",
        "permissionKey": "PATIENT_CREATE",
        "description": "Can register new patients"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
