info:
  name: "Overrides: Create"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/master/overrides"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "hospitalId": "uuid"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
