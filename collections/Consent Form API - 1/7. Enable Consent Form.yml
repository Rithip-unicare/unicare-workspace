info:
  name: 7. Enable Consent Form
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/admin/consentform/enable/{{formId}}"
  headers:
    - name: Authorization
      value: Bearer {{accesstoken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
