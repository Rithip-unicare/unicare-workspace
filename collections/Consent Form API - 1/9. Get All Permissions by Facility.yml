info:
  name: 9. Get All Permissions by Facility
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/admin/consentform/getAllPermissions/{{facilityId}}"
  headers:
    - name: Authorization
      value: Bearer {{accesstoken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: The controller uses @RequestParam("facilityId") despite the {facilityId} in the path.
